discarded_indicators:
- id: health_insurance_coverage
  reason: El diccionario incluye P30 aportes a seguridad social, no cobertura de seguro de salud.
deferred_indicators:
- id: female_headship
  reason: Requiere cruce parentesco de jefatura × sexo; el agregado actual conserva marginales.
- id: potential_solitude_65
  reason: Requiere edad × hogar unipersonal; el agregado actual conserva marginales.
- id: mean_schooling_25_plus
  reason: Requiere edad × ESCOLA y universo 25+; no existe ese cruce agregado.
- id: generational_education_jump
  reason: Requiere edad × ESCOLA para 25–34 y 55–64; no existe ese cruce agregado.
- id: school_lag
  reason: Requiere edad × asistencia/nivel escolar; no existe ese cruce agregado.
- id: digital_gap_by_sex_age
  reason: Requiere TIC × sexo/edad; no existe ese cruce agregado.
- id: labour_gender_gap
  reason: Requiere CONDACT1 × sexo; no existe ese cruce agregado.
- id: internal_net_migration
  reason: Requiere matriz origen-destino por cantón; el agregado actual contiene marginales y códigos
    previos.
- id: canton_origin_destination
  reason: Requiere extracción explícita de flujos origen-destino del microdato privado.
- id: adolescent_motherhood
  reason: Requiere edad × hijos nacidos vivos; no existe ese cruce agregado.
- id: sovi_pca
  reason: Pesos PCA y estandarización nacional corresponden a 1B-2.
- id: demographic_bonus_peak_distance
  reason: Un solo censo no define el pico temporal nacional de la proporción 15–64.
- id: indigenous_language_speakers
  reason: P10R=9 agrupa combinaciones no separables en el agregado; requiere reconstrucción del indicador
    desde microdato.
