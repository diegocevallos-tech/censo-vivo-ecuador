name: Deploy public site

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      preview:
        description: Build and verify without publishing (set false for production)
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: python -m pip install pyarrow pyyaml
      - run: python pipeline/check_derived_manifest.py
      - run: npm ci && npm run build
        working-directory: web
      - name: Restore verified public Release data into Pages build
        env:
          GH_TOKEN: ${{ github.token }}
        run: python pipeline/deploy_derived.py
      - run: python pipeline/check_derived_manifest.py --app-dir web/dist
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist
  deploy:
    if: github.event_name == 'push' || inputs.preview == false
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
