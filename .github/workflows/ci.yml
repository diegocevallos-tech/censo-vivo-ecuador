name: Public checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: python -m pip install pytest ruff pyyaml pyarrow
      - run: ruff check pipeline tests
      - run: python -m pytest tests -q
      - run: python pipeline/verify_public_artifacts.py
      - run: npm ci
        working-directory: web
      - run: npm run build
        working-directory: web
