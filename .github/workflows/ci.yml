name: Public checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: python -m pip install pytest ruff pyyaml pyarrow duckdb numpy pandas
      - run: ruff check pipeline tests
      - run: python pipeline/generate_indicators.py --check
      - run: python -m pytest tests -q
      - name: Check local-path leaks in Markdown
        run: |
          if grep -R -n -F --include='*.md' -e 'C:/' -e 'C:\' -e '/Users/' .; then
            echo 'Absolute local path found in Markdown' >&2
            exit 1
          else
            test "$?" -eq 1
          fi
      - run: python pipeline/verify_public_artifacts.py --root web/public/data/sample
      - run: python pipeline/check_derived_manifest.py
      - name: Verify exact public Release counts and absence of person columns
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python pipeline/deploy_derived.py --dist /tmp/censo-release-check
          python pipeline/verify_release_integrity.py --root /tmp/censo-release-check/data
          python pipeline/06_qa_chunks.py --root /tmp/censo-release-check/data
          if test -f /tmp/censo-release-check/data/indicator-maps/v2a/schema.json; then
            python pipeline/09_qa_indicator_map.py --root /tmp/censo-release-check/data
          fi
      - run: npm ci
        working-directory: web
      - run: npm test
        working-directory: web
      - run: npm run lint
        working-directory: web
      - run: npm run build
        working-directory: web
      - run: python pipeline/check_derived_manifest.py --app-dir web/dist
